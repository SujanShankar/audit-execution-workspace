# Copy to application-local.yml in this folder.
# Profile "local" is enabled by default for mvn spring-boot:run (see pom.xml).
#
# Dev DB (Docker): backend/docker-compose.yml maps Postgres to host port 5433
# so it does not clash with a native PostgreSQL on 5432.
#
# Native PostgreSQL on 5432: use url jdbc:postgresql://localhost:5432/auditdb
# and password matching your install (often set at installation time, not "postgres").
#
# Gmail app passwords must be quoted if they contain spaces.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/auditdb?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres
  mail:
    username: your.email@gmail.com
    password: "your-app-password-or-quoted-if-spaces"
